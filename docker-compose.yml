services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: cityscout-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cityscout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cityscout123}
      POSTGRES_DB: ${POSTGRES_DB:-cityscout}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cityscout}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: cityscout-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cityscout-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cityscout}:${POSTGRES_PASSWORD:-cityscout123}@db:5432/${POSTGRES_DB:-cityscout}
      REDIS_URL: redis://redis:6379/0
      DEBUG: ${DEBUG:-true}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cityscout-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cityscout-celery-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cityscout}:${POSTGRES_PASSWORD:-cityscout123}@db:5432/${POSTGRES_DB:-cityscout}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker -l info -c 2
    volumes:
      - ./backend:/app

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cityscout-celery-beat
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cityscout}:${POSTGRES_PASSWORD:-cityscout123}@db:5432/${POSTGRES_DB:-cityscout}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - celery-worker
    command: celery -A app.tasks.celery_app beat -l info
    volumes:
      - ./backend:/app

  # Flower (Celery Monitor)
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cityscout-flower
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - celery-worker
    command: celery -A app.tasks.celery_app flower --port=5555

volumes:
  postgres_data:
  redis_data:
